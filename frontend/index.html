<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог с игри</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎮 Каталог за компютърни игри</h1>
        <div class="filters">
            <input type="text" id="search" placeholder="Търси по име...">
            <select id="studio">
                <option value="">Всички студиа</option>
            </select>
            <input type="number" id="minRating" min="0" max="10" step="0.5" placeholder="Мин. рейтинг">
            <button id="reset">Изчисти</button>
        </div>
    </header>
    <main id="games-container">Зареждане...</main>
    <script src="script.js"></script>
</body>
</html>
