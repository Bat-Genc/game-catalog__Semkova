<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игри</title>
<style>
  :root{--bg:#12141a;--card:#1c1f29;--card2:#252936;--text:#e8eaf0;--muted:#9aa0b2;--accent:#6c8cff;--danger:#ff5c7a;--border:#2f3445}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;background:rgba(18,20,26,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:12px 20px}
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:20px}
  .spacer{flex:1}
  .tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .tab,button,input,select{font:inherit;color:var(--text)}
  .tab{background:transparent;border:1px solid var(--border);border-radius:999px;padding:6px 16px;cursor:pointer}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .filters input[type=search]:first-child{grid-column:1/-1}
  .filters.hidden{display:none}
  .filters input,.filters select{min-width:0;width:100%}
  input,select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
  .btn{background:var(--accent);border:0;border-radius:8px;padding:8px 16px;cursor:pointer;color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--border)}
  .btn:disabled{opacity:.5;cursor:default}
  main{padding:12px;max-width:1400px;margin:0 auto}
  .note{color:var(--muted);margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;position:relative;border:1px solid transparent;transition:transform .12s,border-color .12s}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .cover{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#0c0d11}
  .cover.ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  .meta{padding:10px 12px}
  .title{font-weight:600;font-size:14px;line-height:1.3;margin:0 0 2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .sub{color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:6px}
  .rating{color:#ffc857;font-weight:600}
  .heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);cursor:pointer;font-size:18px;line-height:1;color:#fff}
  .heart.on{color:var(--danger)}
  .more{text-align:center;margin:24px 0}
  #status{text-align:center;color:var(--muted);margin:20px 0;min-height:1.5em}
  .pegi{display:inline-block;font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;color:#fff;background:#555}
  .pegi.p3,.pegi.p7{background:#2e9d57}.pegi.p12{background:#d38b1d}.pegi.p16{background:#d4621d}.pegi.p18{background:#c8283e}
  dialog{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:0;width:min(900px,94vw);max-height:92vh}
  dialog::backdrop{background:rgba(0,0,0,.7)}
  .dlg{padding:20px;position:relative}
  .close{position:absolute;top:10px;right:12px;background:transparent;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--muted)}
  .detail{display:grid;grid-template-columns:1fr;gap:16px}
  .detail .cover{border-radius:10px;max-width:260px;margin:0 auto}
  .detail h2{margin:0 0 4px;padding-right:30px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .chip{background:var(--card2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
  .shots{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin-top:6px}
  .shots img{height:120px;border-radius:8px;flex:none;background:#0c0d11}
  .block{background:var(--card2);border-radius:10px;padding:12px 14px;margin:12px 0}
  .block h4{margin:0 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .block p{margin:0 0 6px;white-space:pre-wrap}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  a.btn{text-decoration:none;display:inline-block}
  form.auth{display:flex;flex-direction:column;gap:10px;min-width:min(320px,80vw)}
  .err{color:var(--danger);margin:0;min-height:1.2em}
  .link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
  .user{display:flex;align-items:center;gap:8px;color:var(--muted)}

  /* Mobile-first: по-големите екрани надграждат базовите стилове */
  @media(min-width:600px){
    header{padding:12px 20px}
    main{padding:20px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
    .filters{display:flex;flex-wrap:wrap}
    .filters input,.filters select{width:auto}
    .filters input[type=search]:first-child{grid-column:auto}
    .dlg{padding:24px}
  }
  @media(min-width:700px){
    .detail{grid-template-columns:240px 1fr;gap:20px}
    .detail .cover{max-width:none;margin:0}
  }
  @media(min-width:1000px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>🎮 Игри</h1>
    <div class="spacer"></div>
    <div id="auth"></div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="top">Top rated</button>
    <button class="tab" data-tab="trending">Trending</button>
    <button class="tab" data-tab="foryou">За теб</button>
  </div>
  <div class="filters" id="filters">
    <input id="search" type="search" placeholder="Търсене по заглавие…">
    <input id="studio" type="search" placeholder="Студио…">
    <select id="genre"><option value="">Всички жанрове</option></select>
    <select id="pegi">
      <option value="">Всяка възраст</option>
      <option value="3">PEGI до 3</option>
      <option value="7">PEGI до 7</option>
      <option value="12">PEGI до 12</option>
      <option value="16">PEGI до 16</option>
      <option value="18">PEGI до 18</option>
    </select>
  </div>
</header>

<main>
  <p class="note" id="note" hidden></p>
  <div class="grid" id="grid"></div>
  <div id="status"></div>
  <div class="more"><button class="btn" id="more" hidden>Зареди още</button></div>
</main>

<dialog id="detail"><div class="dlg" id="detailBody"></div></dialog>

<dialog id="authDlg">
  <div class="dlg">
    <button class="close" id="authClose" aria-label="Затвори">×</button>
    <h2 id="authTitle" style="margin-top:0">Вход</h2>
    <form class="auth" id="authForm">
      <input id="au" placeholder="Потребителско име" autocomplete="username" required>
      <input id="ap" type="password" placeholder="Парола" autocomplete="current-password" required>
      <p class="err" id="authErr"></p>
      <button class="btn" type="submit" id="authSubmit">Вход</button>
      <button class="link" type="button" id="authSwitch">Нямаш профил? Регистрация</button>
    </form>
  </div>
</dialog>

<script>
// API на същия компютър/мрежов адрес като страницата.
 // Може да се зададе друг порт с ?apiPort=3000 (или друг номер).
 const apiPort = new URLSearchParams(location.search).get('apiPort') || '3000';
 const apiHost = location.hostname || 'localhost';
 const apiProtocol = location.protocol === 'https:' ? 'https:' : 'http:';
 const API = `${apiProtocol}//${apiHost}:${apiPort}/api`;
const PAGE_SIZE = 24;
const $ = s => document.querySelector(s);

const st = {
  tab: 'top', games: [], total: 0, page: 1, req: 0,
  token: localStorage.getItem('token'), user: null, likes: new Set(),
  mode: 'login'
};

/* ---------- помощни ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
const has = v => v != null && String(v).trim() !== '' && !(Array.isArray(v) && v.length === 0);
const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : null;
function toArr(v) {
  if (v == null) return [];
  if (Array.isArray(v)) return v.map(x => typeof x === 'object' && x ? (x.name || x.title || x.url || '') : x).filter(has);
  if (typeof v === 'string') return v.split(',').map(s => s.trim()).filter(Boolean);
  return [];
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------- API ---------- */
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.body) headers['Content-Type'] = 'application/json';
  if (st.token) headers['Authorization'] = 'Bearer ' + st.token;
  const res = await fetch(API + path, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401 && st.token && !opts.noAuthRedirect) {
    clearAuth();
    openAuth('login');
  }
  return res;
}

function clearAuth() {
  localStorage.removeItem('token');
  st.token = null; st.user = null; st.likes = new Set();
  renderAuth(); updateHearts();
  if (st.tab === 'foryou') load(true);
}

/* ---------- профил ---------- */
function renderAuth() {
  const box = $('#auth');
  box.replaceChildren();
  if (st.token) {
    box.append(h('div', { class: 'user' },
      h('span', { text: st.user ? '👤 ' + (st.user.username || st.user.name || 'профил') : '👤' }),
      h('button', { class: 'btn ghost', text: 'Изход', onclick: logout })));
  } else {
    box.append(h('button', { class: 'btn', text: 'Вход / Регистрация', onclick: () => openAuth('login') }));
  }
}

async function logout() {
  if (!confirm('Сигурен ли си, че искаш да излезеш?')) return;
  try { await api('/auth/logout', { method: 'POST', noAuthRedirect: true }); } catch {}
  clearAuth();
}

async function loadProfile() {
  if (!st.token) return;
  try {
    const me = await api('/me');
    if (me.ok) st.user = await me.json();
    const lk = await api('/me/likes');
    if (lk.ok) {
      const data = await lk.json();
      const arr = Array.isArray(data) ? data : (data.games || data.likes || []);
      st.likes = new Set(arr.map(x => String(typeof x === 'object' && x ? (x.game_id ?? x.id) : x)));
    }
  } catch {}
  renderAuth(); updateHearts();
}

function openAuth(mode) {
  setAuthMode(mode);
  $('#authErr').textContent = '';
  if (!$('#authDlg').open) $('#authDlg').showModal();
  $('#au').focus();
}
function setAuthMode(mode) {
  st.mode = mode;
  const login = mode === 'login';
  $('#authTitle').textContent = login ? 'Вход' : 'Регистрация';
  $('#authSubmit').textContent = login ? 'Вход' : 'Регистрация';
  $('#authSwitch').textContent = login ? 'Нямаш профил? Регистрация' : 'Вече имаш профил? Вход';
  $('#ap').autocomplete = login ? 'current-password' : 'new-password';
}
$('#authSwitch').onclick = () => setAuthMode(st.mode === 'login' ? 'register' : 'login');
$('#authClose').onclick = () => $('#authDlg').close();
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#authSubmit'); btn.disabled = true; $('#authErr').textContent = '';
  try {
    const res = await api('/auth/' + st.mode, {
      method: 'POST', noAuthRedirect: true,
      body: { username: $('#au').value.trim(), password: $('#ap').value }
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { $('#authErr').textContent = data.error || data.message || ('Грешка ' + res.status); return; }
    st.token = data.token; st.user = data.user || null;
    localStorage.setItem('token', st.token);
    $('#authForm').reset();
    $('#authDlg').close();
    await loadProfile();
    if (st.tab === 'foryou') load(true);
  } catch { $('#authErr').textContent = 'Няма връзка със сървъра.'; }
  finally { btn.disabled = false; }
});

/* ---------- харесвания ---------- */
function heartBtn(game) {
  const b = h('button', { class: 'heart', 'aria-label': 'Харесай', 'data-heart': game.id });
  b.addEventListener('click', e => { e.stopPropagation(); toggleLike(game.id); });
  paintHeart(b);
  return b;
}
function paintHeart(b) {
  const on = st.likes.has(String(b.dataset.heart));
  b.classList.toggle('on', on);
  b.textContent = on ? '♥' : '♡';
}
function updateHearts() { document.querySelectorAll('[data-heart]').forEach(paintHeart); }

async function toggleLike(id) {
  if (!st.token) { openAuth('login'); return; }
  id = String(id);
  const was = st.likes.has(id);
  was ? st.likes.delete(id) : st.likes.add(id);
  updateHearts();
  try {
    const res = await api('/games/' + encodeURIComponent(id) + '/like', { method: was ? 'DELETE' : 'PUT' });
    if (!res.ok && res.status !== 204) throw new Error();
  } catch {
    was ? st.likes.add(id) : st.likes.delete(id);
    updateHearts();
  }
}

/* ---------- карти ---------- */
function pegiBadge(age) {
  const n = parseInt(age);
  if (isNaN(n)) return null;
  return h('span', { class: 'pegi p' + n, text: 'PEGI ' + n });
}

function card(g) {
  const img = safeUrl(g.image_url);
  const rating = parseFloat(g.rating);
  const cover = img
    ? h('img', { class: 'cover', src: img, alt: g.title || '', loading: 'lazy', decoding: 'async', width: '300', height: '400', referrerpolicy: 'no-referrer' })
    : h('div', { class: 'cover ph', text: 'Няма корица' });
  if (img) cover.addEventListener('error', () => cover.replaceWith(h('div', { class: 'cover ph', text: 'Няма корица' })));
  return h('div', { class: 'card', onclick: () => openDetail(g) },
    cover,
    heartBtn(g),
    h('div', { class: 'meta' },
      h('p', { class: 'title', text: g.title || 'Без заглавие' }),
      h('div', { class: 'sub' },
        h('span', { text: [g.studio, g.year].filter(has).join(' · ') }),
        !isNaN(rating) ? h('span', { class: 'rating', text: '★ ' + rating.toFixed(1) }) : null)));
}

/* ---------- зареждане ---------- */
function setStatus(t) { $('#status').textContent = t || ''; }

async function load(reset) {
  const my = ++st.req;
  const grid = $('#grid');
  if (reset) {
    st.page = 1; st.games = []; st.total = 0;
    grid.replaceChildren(); $('#note').hidden = true;
  }
  $('#more').hidden = true;
  setStatus('Зареждане…');
  try {
    let games, total, note = '';
    if (st.tab === 'top') {
      const p = new URLSearchParams({ sort: 'rating', limit: PAGE_SIZE, page: st.page });
      const f = { search: $('#search').value.trim(), studio: $('#studio').value.trim(), genre: $('#genre').value, pegi: $('#pegi').value };
      for (const [k, v] of Object.entries(f)) if (v) p.set(k, v);
      const res = await api('/games?' + p);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      games = await res.json();
      const hdr = parseInt(res.headers.get('X-Total-Count'));
      // ако хедърът не е достъпен (CORS expose), гадаем по размера на страницата
      total = isNaN(hdr) ? (games.length < PAGE_SIZE ? st.games.length + games.length : Infinity) : hdr;
    } else if (st.tab === 'trending') {
      const res = await api('/trending');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      games = await res.json(); total = games.length;
    } else {
      const res = await api('/recommendations');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      games = data.games || []; total = games.length;
      note = data.basedOn === 'likes'
        ? 'Препоръки въз основа на игрите, които си харесал.'
        : 'Показваме популярни игри. ' + (st.token ? 'Харесай няколко игри за персонални препоръки.' : 'Влез и харесай игри за персонални препоръки.');
    }
    if (my !== st.req) return; // остарял отговор
    st.games.push(...games);
    st.total = total;
    games.forEach(g => grid.append(card(g)));
    if (note) { $('#note').textContent = note; $('#note').hidden = false; }
    setStatus(st.games.length ? '' : 'Няма намерени игри.');
    $('#more').hidden = !(st.tab === 'top' && st.games.length > 0 && games.length > 0 && st.games.length < st.total);
  } catch (e) {
    if (my !== st.req) return;
    if (!reset && st.tab === 'top') st.page--;
    setStatus('Грешка при зареждане. Проверете дали бекендът работи.');
    if (!reset && st.games.length) $('#more').hidden = false;
  }
}

$('#more').onclick = () => { st.page++; load(false); };

/* ---------- табове и филтри ---------- */
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  st.tab = t.dataset.tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === t));
  $('#filters').classList.toggle('hidden', st.tab !== 'top');
  load(true);
});
const reload = () => load(true);
$('#search').addEventListener('input', debounce(reload, 350));
$('#studio').addEventListener('input', debounce(reload, 350));
$('#genre').addEventListener('change', reload);
$('#pegi').addEventListener('change', reload);

async function loadGenres() {
  try {
    const res = await api('/genres');
    if (!res.ok) return;
    const list = await res.json();
    const sel = $('#genre');
    list.forEach(g => sel.append(h('option', { value: g.name, text: g.count != null ? `${g.name} (${g.count})` : g.name })));
  } catch {}
}

/* ---------- прозорец с подробности ---------- */
function renderDetail(g) {
  const body = $('#detailBody');
  const img = safeUrl(g.image_url);
  const rating = parseFloat(g.rating);
  const genres = toArr(g.genres), platforms = toArr(g.platforms), tags = toArr(g.official_tags);
  const shots = toArr(g.screenshots).map(safeUrl).filter(Boolean);
  const steam = safeUrl(g.steam_url), igdb = safeUrl(g.igdb_url), epic = safeUrl(g.epic_url);
  const badge = pegiBadge(g.pegi_age);

  const left = h('div', {},
    img ? h('img', { class: 'cover', src: img, alt: g.title || '' }) : h('div', { class: 'cover ph', text: 'Няма корица' }));

  const right = h('div', {},
    h('h2', { text: g.title || 'Без заглавие' }),
    h('div', { class: 'sub', style: 'justify-content:flex-start;gap:12px;align-items:center' },
      [g.studio, g.year].filter(has).length ? h('span', { text: [g.studio, g.year].filter(has).join(' · ') }) : null,
      !isNaN(rating) ? h('span', { class: 'rating', text: '★ ' + rating.toFixed(1) }) : null,
      badge),
    genres.length ? h('div', { class: 'chips' }, genres.map(x => h('span', { class: 'chip', text: x }))) : null,
    platforms.length ? h('div', { class: 'chips' }, h('span', { class: 'sub', text: 'Платформи:' }), platforms.map(x => h('span', { class: 'chip', text: x }))) : null,
    has(g.summary) ? h('p', { text: g.summary }) : null,
    has(g.content_explanation)
      ? h('div', { class: 'block' },
          h('h4', { text: 'Защо тази възрастова оценка' }),
          h('p', { text: g.content_explanation }),
          has(g.age_synopsis) ? h('p', { class: 'sub', text: 'Официално (EN): ' + g.age_synopsis }) : null)
      : null,
    has(g.guide) ? h('div', { class: 'block' }, h('h4', { text: 'Упътване' }), h('p', { text: g.guide })) : null,
    tags.length ? h('div', { class: 'chips' }, tags.map(x => h('span', { class: 'chip', text: '#' + x }))) : null,
    h('div', { class: 'links' },
      steam ? h('a', { class: 'btn', href: steam, target: '_blank', rel: 'noopener noreferrer', text: 'Steam' }) : null,
      igdb ? h('a', { class: 'btn ghost', href: igdb, target: '_blank', rel: 'noopener noreferrer', text: 'igdb.com' }) : null,
      epic ? h('a', { class: 'btn ghost', href: epic, target: '_blank', rel: 'noopener noreferrer', text: 'Epic Games' }) : null,
      (() => { const b = h('button', { class: 'btn ghost', 'data-heart': g.id, onclick: () => toggleLike(g.id) }); paintHeartText(b); return b; })()));

  body.replaceChildren(
    h('button', { class: 'close', 'aria-label': 'Затвори', text: '×', onclick: () => $('#detail').close() }),
    h('div', { class: 'detail' }, left, right),
    shots.length ? h('div', { class: 'shots' }, shots.map(s => h('a', { href: s, target: '_blank', rel: 'noopener noreferrer' }, h('img', { src: s, alt: 'Кадър', loading: 'lazy', decoding: 'async', height: '120' })))) : null);
}
// бутонът в прозореца показва текст, не само сърце
function paintHeartText(b) {
  const on = st.likes.has(String(b.dataset.heart));
  b.textContent = on ? '♥ Харесана' : '♡ Харесай';
}
const _paint = paintHeart;
paintHeart = function (b) { b.classList.contains('btn') ? paintHeartText(b) : _paint(b); };

async function openDetail(g) {
  renderDetail(g);
  if (!$('#detail').open) $('#detail').showModal();
  try {
    const res = await api('/games/' + encodeURIComponent(g.id));
    if (res.ok && $('#detail').open) renderDetail({ ...g, ...(await res.json()) });
  } catch {}
}
$('#detail').addEventListener('click', e => { if (e.target === $('#detail')) $('#detail').close(); });
$('#authDlg').addEventListener('click', e => { if (e.target === $('#authDlg')) $('#authDlg').close(); });

/* ---------- старт ---------- */
renderAuth();
loadGenres();
loadProfile();
load(true);
</script>
</body>
